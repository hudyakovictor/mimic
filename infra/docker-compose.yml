services:
  postgres:
    image: postgres:17
    environment: {POSTGRES_USER: mimicguard, POSTGRES_PASSWORD: mimicguard, POSTGRES_DB: mimicguard}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: mimicguard, MINIO_ROOT_PASSWORD: change-me-now}
    ports: ["9000:9000", "9001:9001"]
volumes: {pgdata: {}}
