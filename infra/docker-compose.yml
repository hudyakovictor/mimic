version: "3.9"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mimicguard
      POSTGRES_PASSWORD: mimicguard
      POSTGRES_DB: mimicguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimicguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mimicguard
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 mimicguard change-me-now;
      mc mb -p local/mimicguard-videos || true;
      mc mb -p local/mimicguard-derived || true;
      mc mb -p local/mimicguard-clips || true;
      mc mb -p local/mimicguard-models || true;
      mc mb -p local/mimicguard-audit || true;
      mc anonymous set none local/mimicguard-videos || true;
      mc anonymous set none local/mimicguard-clips || true;
      mc anonymous set none local/mimicguard-derived || true;
      echo 'MinIO initialized';
      "

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mimicguard:mimicguard@postgres:5432/mimicguard
      REDIS_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mimicguard
      S3_SECRET_KEY: change-me-now
      JWT_SECRET: dev-secret-change-me-in-production
      LOG_FILE: /var/log/mimicguard/mimicguard.jsonl
    volumes:
      - mimicguard-logs:/var/log/mimicguard
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: >
      sh -c "cd /app/services/api && alembic upgrade head &&
             cd /app && python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mimicguard:mimicguard@postgres:5432/mimicguard
      REDIS_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mimicguard
      S3_SECRET_KEY: change-me-now
      LOG_FILE: /var/log/mimicguard/mimicguard.jsonl
    volumes:
      - mimicguard-logs:/var/log/mimicguard
    command: dramatiq worker.__main__ -p 2 -t 4

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  mimicguard-logs:
