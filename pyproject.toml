[project]
name = "mimicguard"
version = "0.1.0"
description = "MimicGuard — facial motion inconsistency detection for low-quality video"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5,<6",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "orjson>=3.10,<4",
  "structlog>=24,<26",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-instrumentation-redis>=0.48b0,<1",
  "opentelemetry-exporter-otlp>=1.27,<2",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "python-multipart>=0.0.12,<1",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "apscheduler>=3.10,<4",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
landmarks = [
  "mediapipe>=0.10,<1",
  "opencv-python-headless>=4.10,<5",
]
asr = [
  "faster-whisper>=1.0,<2",
]
youtube = [
  "yt-dlp>=2024.8,<2026",
]
all = [
  "mimicguard[landmarks,asr,youtube]"
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-postgresql>=6,<7",
  "hypothesis>=6.115,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-passlib>=1.7,<2",
  "dramatiq[redis]>=1.17,<2",
  "fakeredis>=2.25,<3",
  "freezegun>=1.5,<2",
  "schemathesis>=3.27,<4",
  "locust>=2.32,<3",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["**/migrations/**", "**/alembic/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501", "B008", "B904"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["services", "packages"]
omit = ["**/migrations/*", "**/alembic/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
