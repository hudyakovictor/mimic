[project]
name = "mimicguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1", "alembic>=1.13,<2", "redis>=5,<6",
  "numpy>=2,<3", "orjson>=3.10,<4", "structlog>=24,<26"
]
[project.optional-dependencies]
landmarks = ["mediapipe>=0.10,<1", "opencv-python-headless>=4.10,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
